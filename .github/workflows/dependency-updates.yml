name: Dependency Updates

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '24'

jobs:
  dependency-updates:
    name: Check & Update Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Check for outdated dependencies
        id: outdated-check
        run: |
          npm outdated --json > outdated.json 2>&1 || true

          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "{}" ]; then
            echo "outdated_packages=true" >> $GITHUB_OUTPUT
            echo "📦 Updates available:"
            npm outdated || true
          else
            echo "outdated_packages=false" >> $GITHUB_OUTPUT
            echo "✅ All packages are up to date!"
          fi

      - name: 🔄 Update dependencies
        if: steps.outdated-check.outputs.outdated_packages == 'true'
        id: update-deps
        run: |
          cp package-lock.json package-lock.json.old

          npm update --save

          if diff -q package-lock.json package-lock.json.old > /dev/null 2>&1; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No actual changes to lockfile"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Dependencies updated successfully"
          fi

          rm -f package-lock.json.old

      - name: 🔍 Type check
        if: steps.update-deps.outputs.changes == 'true'
        run: npx tsc --noEmit

      - name: 🔍 Lint check
        if: steps.update-deps.outputs.changes == 'true'
        run: npx @biomejs/biome check src/

      - name: 🏗️ Build project
        if: steps.update-deps.outputs.changes == 'true'
        run: npm run build

      - name: 🧪 Run tests
        if: steps.update-deps.outputs.changes == 'true'
        run: npm test

      - name: 📝 Generate PR body
        if: steps.update-deps.outputs.changes == 'true'
        id: pr-body
        run: |
          BRANCH_NAME="deps/update-$(date +%Y-%m-%d)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          cat > pr-body.md << 'PREOF'
          ## 📦 Automated Dependency Updates

          ### Outdated Packages (before update)
          ```
          PREOF

          npm outdated 2>&1 >> pr-body.md || true

          cat >> pr-body.md << 'PREOF'
          ```

          ### Verification
          - ✅ Type check passed
          - ✅ Lint check passed
          - ✅ Build succeeded
          - ✅ Tests passed

          ### Review Checklist
          - [ ] Review updated packages for breaking changes
          - [ ] Test critical application features
          - [ ] Check changelogs for major updates

          ---
          *Created automatically by the Dependency Updates workflow*
          PREOF

      - name: 🚀 Create Pull Request
        if: steps.update-deps.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): update dependencies"
          body-path: pr-body.md
          branch: ${{ steps.pr-body.outputs.branch_name }}
          delete-branch: true
          labels: |
            dependencies
            automated
          reviewers: ${{ github.repository_owner }}

  dependency-summary:
    name: Dependency Health Summary
    runs-on: ubuntu-latest
    needs: dependency-updates
    if: always()

    steps:
      - name: 📊 Workflow Summary
        run: |
          echo "## 📦 Dependency Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.dependency-updates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check the **Pull Requests** tab for any new update PRs" >> $GITHUB_STEP_SUMMARY
