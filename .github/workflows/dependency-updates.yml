name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-updates:
    name: Check & Update Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0 # Skip Husky hooks in CI

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📦 Check for outdated dependencies
        id: outdated-check
        run: |
          # Get outdated packages using bun (skip .env loading)
          BUN_ENV="" bun outdated --no-install 2>&1 | grep -v "\.env" | tee outdated-output.txt || true

          # Debug: show raw output
          echo "=== Raw output ==="
          cat outdated-output.txt
          echo "=== End raw output ==="

          # Check if there are outdated packages
          # bun outdated shows a table when packages are outdated
          if [ -s outdated-output.txt ] && grep -qE "│|├|└|@" outdated-output.txt; then
            echo "outdated_packages=true" >> $GITHUB_OUTPUT
            echo "📦 Updates available"
          else
            echo "outdated_packages=false" >> $GITHUB_OUTPUT
            echo "✅ All packages are up to date!"
          fi

      - name: 🔄 Update dependencies
        if: steps.outdated-check.outputs.outdated_packages == 'true'
        id: update-deps
        run: |
          # Save current lockfile for comparison
          cp bun.lock bun.lock.old

          # Update all dependencies
          bun update

          # Check if lockfile changed
          if diff -q bun.lock bun.lock.old > /dev/null 2>&1; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No actual changes to lockfile"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Dependencies updated successfully"

            # Generate diff summary for PR
            echo "### Updated packages:" > changes-summary.txt
            diff bun.lock.old bun.lock | grep -E "^[<>].*@" | head -50 >> changes-summary.txt || true
          fi

          rm -f bun.lock.old

      - name: ⚡ Run type check
        if: steps.update-deps.outputs.changes == 'true'
        run: bun run typecheck

      - name: 🏗️ Build project
        if: steps.update-deps.outputs.changes == 'true'
        run: bun run build

      - name: 📝 Generate PR body
        if: steps.update-deps.outputs.changes == 'true'
        id: pr-body
        run: |
          BRANCH_NAME="deps/update-$(date +%Y-%m-%d)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          cat > pr-body.md << 'EOF'
          ## 📦 Automated Dependency Updates

          This PR contains automated dependency updates.

          ### Outdated Packages (before update)
          ```
          EOF

          # Add outdated output if available
          if [ -s outdated-output.txt ]; then
            cat outdated-output.txt >> pr-body.md
          else
            echo "Unable to retrieve outdated packages list" >> pr-body.md
          fi

          cat >> pr-body.md << 'EOF'
          ```

          ### Changes Made
          EOF

          # Add changes summary if available
          if [ -s changes-summary.txt ]; then
            cat changes-summary.txt >> pr-body.md
          fi

          cat >> pr-body.md << 'EOF'

          ### Verification
          - ✅ Type check passed
          - ✅ Linting passed
          - ✅ Build succeeded

          ### Review Checklist
          - [ ] Review updated packages for breaking changes
          - [ ] Test critical application features
          - [ ] Check changelogs for major updates

          ---
          *Created automatically by the Dependency Updates workflow*
          EOF

      - name: 🚀 Create Pull Request
        if: steps.update-deps.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): update dependencies"
          body-path: pr-body.md
          branch: ${{ steps.pr-body.outputs.branch_name }}
          delete-branch: true
          labels: |
            dependencies
            automated
          reviewers: ${{ github.repository_owner }}

  dependency-summary:
    name: Dependency Health Summary
    runs-on: ubuntu-latest
    needs: dependency-updates
    if: always()

    steps:
      - name: 📊 Workflow Summary
        run: |
          echo "## 📦 Dependency Health Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Outdated Check**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Update Status**: Check Pull Requests tab for any new dependency update PRs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Features" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Automatically updates dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Runs type check, lint, and build verification" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 Creates PR if updates are available and pass checks" >> $GITHUB_STEP_SUMMARY
