# ============================================
# SonarQube Configuration for Authio Frontend
# ============================================
# Copy this file to sonar-project.properties and update the token

# Project Identification
sonar.projectKey=<PROJECT_KEY>
sonar.projectName=<PROJECT_NAME>
sonar.projectVersion=1.0.0

# Server Configuration
sonar.host.url=http://localhost:9000
sonar.token={TOKEN_GENERATE_FROM_SONAR_SERVER}

# Source Configuration
sonar.projectBaseDir=.
sonar.sources=src
sonar.sourceEncoding=UTF-8

# TypeScript Configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Test Configuration (uncomment when tests are added)
# sonar.tests=src
# sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Coverage Reports (uncomment when coverage is configured)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source Exclusions
sonar.exclusions=

# Duplication Detection Exclusions
sonar.cpd.exclusions=

# Test Exclusions
sonar.test.exclusions=

# Coverage Exclusions
sonar.coverage.exclusions=
