# ============================================
# SonarQube Configuration for Authio Frontend
# ============================================
# Copy this file to sonar-project.properties and update the token

# Project Identification
sonar.projectKey=<PROJECT_KEY>
sonar.projectName=<PROJECT_NAME>
sonar.projectVersion=1.0.0

# Server Configuration
sonar.host.url=http://localhost:9000
sonar.token={TOKEN_GENERATE_FROM_SONAR_SERVER}

# Source Configuration
sonar.projectBaseDir=.
sonar.sources=src
sonar.sourceEncoding=UTF-8

# TypeScript Configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Test Configuration
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source Exclusions (generated files, type defs, config, non-analyzable code)
sonar.exclusions=\
  src/routeTree.gen.ts,\
  src/vite-env.d.ts,\
  src/styles.css,\
  src/test/**,\
  src/types/**,\
  src/enums/**,\
  src/constants/**,\
  src/i18n/**,\
  src/**/index.ts

# Duplication Detection Exclusions (tests often have similar structure)
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Test Exclusions (already handled by sonar.test.inclusions)
sonar.test.exclusions=

# Coverage Exclusions (align with vitest coverage exclusions)
sonar.coverage.exclusions=\
  src/routeTree.gen.ts,\
  src/vite-env.d.ts,\
  src/styles.css,\
  src/test/**,\
  src/routes/**,\
  src/types/**,\
  src/enums/**,\
  src/constants/**,\
  src/i18n/**,\
  src/**/index.ts,\
  **/*.d.ts
